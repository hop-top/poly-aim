[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hop-top-aim"
version = "0.1.0-alpha.2"
description = "AI model registry client backed by models.dev"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
cache = ["platformdirs>=4.0"]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
