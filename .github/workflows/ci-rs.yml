name: CI (Rust)

on:
  push:
    branches: [main]
    paths:
      - "rs/**"
      - "spec/fixtures/query-vectors.json"
      - "spec/fixtures/registry-vectors.json"
      - "spec/fixtures/api-fixture.json"
      - ".github/workflows/ci-rs.yml"
  pull_request:
    branches: [main]
    paths:
      - "rs/**"
      - "spec/fixtures/**"
      - ".github/workflows/ci-rs.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: rs

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs
      - run: cargo test --all-features
