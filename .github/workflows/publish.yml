name: publish

on:
  push:
    tags: ['*/v*']
  # Manual trigger: re-run a publish for an existing tag without re-pushing.
  # Caveat — workflow_dispatch replays against the workflow file at the
  # tag's commit, not main HEAD; see hop-top/.github
  # references/how-to/retrigger-failed-publish.md.
  workflow_dispatch: {}

jobs:
  publish:
    permissions:
      contents: read
      id-token: write  # required by publish-py (PyPI OIDC trusted publishing)
    uses: hop-top/.github/.github/workflows/publish-on-tag.yml@v0
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_REGISTRY_TOKEN: ${{ secrets.PYPI_REGISTRY_TOKEN }}
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      GH_MIRROR_PAT: ${{ secrets.GH_MIRROR_PAT }}
    with:
      homepage: https://hop.top/aim
      description-prefix: "READ-ONLY MIRROR"
      ecosystems: |
        aim-ts:
          dir: ts
          ecosystem: ts
          package: "@hop-top/aim"
          mirror: hop-top/aim-ts
          # aim's ts SDK is npm-native (no pnpm-lock.yaml, no build step
          # — distributed as TypeScript source via package.json#exports).
          # pnpm gracefully installs npm projects with --no-frozen-lockfile.
          test-command: pnpm install --no-frozen-lockfile && pnpm test
          build-command: "true"
        aim-py:
          dir: py
          ecosystem: py
          package: hop-top-aim
          mirror: hop-top/aim-py
          # Token auth until PyPI OIDC pending-publisher is set up.
          pypi-auth: token
        aim-rs:
          dir: rs
          ecosystem: rs
          package: hop-top-aim
          mirror: hop-top/aim-rs
        aim-php:
          dir: php
          ecosystem: php
          package: hop-top/aim
          mirror: hop-top/aim-php
        aim:
          dir: .
          ecosystem: go
          mirror: hop-top/aim
